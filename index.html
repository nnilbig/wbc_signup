<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>WHONEXT B.C. 大平台</title>
<meta property="og:title" content="WHONEXT B.C. 大平台">
<meta property="og:description" content="查看最新場次・即時名額，WHONEXT 羽球線上報名。">
<meta property="og:url" content="https://nnilbig.github.io/wbc_signup/">
<meta property="og:image" content="https://nnilbig.github.io/wbc_signup/og.png">

<!-- 加到主畫面：名稱、圖示、全螢幕（名稱由 config.js 的 appName 覆寫） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="WHONEXT">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<!-- 背景：手繪塗鴉風的羽球場格線（13.4m × 6.1m，1m = 100 單位） -->

    <filter id="rough1"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
    <g id="lines">
      <rect x="0" y="0" width="610" height="1340"/>
      <path d="M46 0V1340M564 0V1340"/>

      <path d="M305 0V472M305 868V1340"/>

    </g>

      <!-- 多面體南瓜：外框、兩側瓜稜、蒂頭 -->

      <path d="M160 750L200 795 240 765 272 808 305 775 338 808 370 765 410 795 450 750 420 835 305 860 190 835Z"/>

      <path d="M-30 990H640" stroke-dasharray="2 14" stroke-width="7"/>
      <path d="M500 110A80 80 0 1 0 590 240 62 62 0 1 1 500 110Z"/>
      <path d="M60 250l40-20 18 18 14-30 14 30 18-18 40 20-30 2-18 18-24-12-24 12-18-18Z"/>

    </g>
    <g id="theme-xmas">

      <path d="M275 830V900H335V830"/>
      <path d="M305 216L316 247 349 248 323 268 332 299 305 281 278 299 287 268 261 248 294 247Z"/>

      <path d="M-30 990H640" stroke-dasharray="2 14" stroke-width="7"/>

    <g id="theme-newyear">
      <!-- 空心字 HAPPY NEW YEAR -->
      <text x="305" y="220" text-anchor="middle" font-family="Bebas Neue, Impact, sans-serif" font-size="190" letter-spacing="8">HAPPY</text>
      <text x="305" y="370" text-anchor="middle" font-family="Bebas Neue, Impact, sans-serif" font-size="130" letter-spacing="6">NEW YEAR</text>

  <g transform="rotate(-7 305 670)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <use class="court-use" href="#lines" filter="url(#rough1)" stroke-width="5"/>
    <use class="court-use" href="#lines" filter="url(#rough2)" stroke-width="2" opacity=".6" transform="translate(4 -3)"/>
  </g>
</svg>
<!-- 下拉重新整理的燈號（主畫面 App 才會用到） -->
<div id="ptr" class="ptr leds" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="hero">
    <div>
      <h1 class="brand">WHONEXT B.C.</h1>
      <p class="sub"><span id="subText">大平台</span><span id="envTag" class="env" hidden>TEST</span></p>
    </div>
    <button id="pushBtn" class="bell" type="button" hidden></button>
  </header>
  <!-- iPhone 在 Safari 開啟時：引導加到主畫面 -->
  <section id="guide" class="card guide" hidden>
    <button id="guideClose" class="x" type="button" aria-label="關閉">&times;</button>
    <h2>加到主畫面，接收遞補通知</h2>
    <ol>
      <li>點 Safari 下方的「分享」<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2"/></svg></li>
      <li>選「加入主畫面」<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg></li>
      <li>從主畫面的 <b id="guideApp">WHONEXT</b> 圖示打開，按右上角「開啟通知」</li>
    </ol>
  </section>
  <details class="card info">
    <summary>報名注意事項</summary>
    <ol>
      <li>點報名場次展開，輸入姓名後按「確認報名」。</li>
      <li>報名額滿會自動排入候補。</li>
      <li>有人取消時，最早的候補自動遞補，並發送通知。</li>
      <li>「取消報名」點名單上的名字可直接帶入姓名，取消前請確認姓名正確。</li>
    </ol>
  </details>
  <h2 class="title">選擇報名場次</h2>
  <main id="list"><div class="state loading"><span class="leds spin" aria-label="載入中"><i></i><i></i><i></i></span></div></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
